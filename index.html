<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLB Tennis Thăng Long</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f5f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 10; }
        thead th.sticky-col { z-index: 30; background-color: #f1f5f9; }
        thead th { position: sticky; top: 0; z-index: 20; background-color: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

    <!-- CẤU TRÚC APP HOÀN CHỈNH -->
    <div id="appScreen" class="flex flex-col min-h-screen">
        <!-- (Bạn dùng lại phần header, nav, và các tab từ bản code trước đây. Sao chỉ cập nhật lại các hàm logic trong thẻ script bên dưới để đảm bảo mọi tính năng trùng lặp và thông báo hoạt động chính xác) -->
        <main class="max-w-7xl mx-auto px-3 py-4 flex-grow w-full space-y-4">
             <!-- Nội dung các tab (Dashboard, Matches, v.v...) giữ nguyên như cũ -->
        </main>
    </div>

    <script>
        // ... (CÁC KHAI BÁO BIẾN VÀ HÀM INIT GIỮ NGUYÊN) ...

        // 1. Logic kiểm tra trùng Trận đấu (đúng 4 người, đúng tỷ số, 18h qua)
        function addMatch(e) {
            e.preventDefault();
            let p1A = document.getElementById('matchP1A').value, p2A = document.getElementById('matchP2A').value;
            let p1B = document.getElementById('matchP1B').value, p2B = document.getElementById('matchP2B').value;
            let scoreA = parseInt(document.querySelector('input[name="scoreA"]:checked')?.value) || 0;
            let scoreB = parseInt(document.querySelector('input[name="scoreB"]:checked')?.value) || 0;
            let specialBet = parseInt(document.getElementById('specialBet').value);

            let newPlayersSet = new Set([p1A, p2A, p1B, p2B]);
            let nowTime = Date.now();
            let limitMs = 18 * 60 * 60 * 1000;

            let duplicateMatch = matches.find(m => {
                let mTimeMs = parseMatchTimeToTimestamp(m.time);
                if (nowTime - mTimeMs > limitMs) return false;
                if (m.scoreA !== scoreA || m.scoreB !== scoreB) return false;
                let oldPlayersSet = new Set([m.p1_v1, m.p2_v1, m.p1_v2, m.p2_v2]);
                return oldPlayersSet.size === newPlayersSet.size && [...newPlayersSet].every(p => oldPlayersSet.has(p));
            });

            if (duplicateMatch && !confirm(`Hệ thống đã ghi nhận 1 trận tương tự lúc "${duplicateMatch.time}". Bạn có muốn ghi thêm trận này không?`)) return;

            enqueueAction("addMatch", { match: { id: Date.now(), time: new Date().toLocaleString('vi-VN'), p1_v1: p1A, p2_v1: p2A, scoreA, scoreB, p1_v2: p1B, p2_v2: p2B, specialBet } }, "Đã lưu kết quả trận đấu!");
            document.getElementById('matchForm').reset();
        }

        // 2. Logic kiểm tra trùng Thưởng sân & Tiền Quỹ Quý (có OK/Hủy)
        function handleDashboardSubmit() {
            let main = document.getElementById('dashMainUser').value;
            let actType = document.querySelector('input[name="actType"]:checked').value;

            if (actType === "dat16" || actType === "dat18") {
                let frame = (actType === "dat16") ? "16h-18h" : "18h-20h (CVTT5)";
                let duplicate = bookingLogs.find(b => b.name === main && b.frame === frame && (Date.now() - new Date(b.time.split('/').reverse().join('-')).getTime()) < 18*60*60*1000);
                
                if (duplicate && !confirm(`Thành viên ${main} đã được ghi nhận thưởng sân ${frame} lúc ${duplicate.time}. Bạn có muốn ghi thêm lần nữa?`)) return;
                
                let reward = (actType === "dat16") ? systemSettings.reward16h : systemSettings.reward18h;
                enqueueAction("addBooking", { booking: { id: Date.now(), time: new Date().toLocaleString('vi-VN'), name: main, frame, reward } }, "Đã ghi nhận thưởng sân!");
            }
            else if (actType === "quy") {
                let key = document.getElementById('selectQuy').value + "_" + document.getElementById('selectNam').value;
                let m = members.find(item => item.name === main);
                if (m.quyHistory && m.quyHistory[key] && !confirm("Thành viên này đã đóng quỹ quý này rồi, bạn có muốn cập nhật lại?")) return;
                
                if (!m.quyHistory) m.quyHistory = {};
                m.quyHistory[key] = systemSettings.quyAmount;
                enqueueAction("updateMember", { members: members }, "Đã ghi nhận Tiền quỹ QUÝ!");
            }
        }

        // 3. Thông báo alert cho Nộp tiền và Sổ quỹ
        function submitUserPayment() {
            let main = document.getElementById('dashMainUser').value;
            let val = parseInt(document.getElementById('userPaidInput').value) || 0;
            if (val <= 0) return alert("Nhập số tiền hợp lệ!");
            enqueueAction("addGocLog", { gocLog: { id: Date.now(), time: new Date().toLocaleString('vi-VN'), name: main, amount: val, note: "Thành viên tự nhập CK" } }, "Đã ghi nhận nộp " + val.toLocaleString() + "đ tiền góc!");
            alert("Hệ thống đã ghi nhận nộp " + val.toLocaleString() + "đ tiền góc.");
            document.getElementById('userPaidInput').value = '';
        }

        function addCashbookEntry(e) {
            e.preventDefault();
            let cat = document.getElementById('cbCategory').value, amt = parseInt(document.getElementById('cbAmount').value);
            enqueueAction("addCashbook", { cashbook: { id: Date.now(), category: cat, amount: amt, note: document.getElementById('cbNote').value || cat, time: new Date().toLocaleDateString('vi-VN') } }, `Đã ghi nhận khoản ${cat} thành công!`);
            alert(`Đã ghi nhận khoản ${cat} với số tiền ${amt.toLocaleString()}đ thành công!`);
        }

        // ... (CÁC HÀM KHÁC GIỮ NGUYÊN) ...
    </script>
</body>
</html>
